name: CI-Release

# Optimised build and the test suite, with two compilers and two MPI
# implementations. The oversubscribed 27-rank runs are left to the nightly
# Debug job; everything else runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "Run only the tests matching this ctest -R regex (empty: the usual selection)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.compiler }} + ${{ matrix.mpi }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian's mpicc carries GCC-only LTO flags, so MPICH is paired with gcc.
          - { os: ubuntu-22.04, compiler: gcc, mpi: mpich }
          - { os: ubuntu-24.04, compiler: clang, mpi: openmpi }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          compiler: ${{ matrix.compiler }}
          mpi: ${{ matrix.mpi }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF -DMFTL_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "$TESTS" ]; then
            ctest --test-dir build --output-on-failure -j 4 --timeout 900 -R "$TESTS"
          else
            ctest --test-dir build --output-on-failure -j 4 --timeout 900 -LE np27
          fi

  macos:
    # The development platform: Apple clang, Open MPI 5 from Homebrew, arm64.
    # macOS minutes count tenfold against a private repository's quota, so
    # until the repository is public this job runs only when started by hand.
    name: clang + openmpi (macos-15)
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          compiler: clang
          mpi: openmpi
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF -DMFTL_ENABLE_GPU=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "$TESTS" ]; then
            ctest --test-dir build --output-on-failure -j 3 --timeout 900 -R "$TESTS"
          else
            ctest --test-dir build --output-on-failure -j 3 --timeout 900 -LE np27
          fi
