name: CI-Debug

# Debug build with AddressSanitizer and UndefinedBehaviorSanitizer. Several
# tests write the last addressable element of every pool array on purpose, so a
# sub-array that was not grown with the rest fails here rather than corrupting
# memory silently. On push and pull request the long and the 27-rank tests are
# skipped; the nightly run takes the whole suite.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "Run only the tests matching this ctest -R regex (empty: the usual selection)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: gcc + mpich, ASan/UBSan/LSan
    runs-on: ubuntu-22.04   # MPICH; see .github/actions/setup
    timeout-minutes: 180
    env:
      # Leaks are checked at every process exit; the MPI stack's own long-lived
      # allocations are suppressed in tests/lsan.supp. Everything else is fatal.
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp:print_suppressions=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          compiler: gcc
          mpi: mpich
      - name: Allow ASan's shadow memory layout
        # Current runner kernels randomise mmap with 32 bits, which ASan cannot map around.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "$TESTS" ]; then
            ctest --test-dir build --output-on-failure -j 4 --timeout 3600 -R "$TESTS"
          elif [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            ctest --test-dir build --output-on-failure -j 4 --timeout 3600
          else
            ctest --test-dir build --output-on-failure -j 4 --timeout 1800 -LE "np27|long"
          fi
