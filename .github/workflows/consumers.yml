name: CI-Consumers

# Uses MFTL the way a downstream solver would: from an installed CMake package
# (find_package) and from a source checkout (add_subdirectory), each from C and
# from C++ and from a C++-ONLY project (no C language enabled), and runs the
# result on two ranks. The package is installed twice, Release and Debug (a
# Debug install must be unsanitized), and a sanitized Debug install is checked
# to be refused rather than to produce a package nothing can link.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          compiler: gcc
          mpi: openmpi
      - name: Build and install the library (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SANITIZERS=OFF \
                -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build
          cmake --install build --prefix "$RUNNER_TEMP/mftl"
      - name: find_package(MFTL)
        run: |
          cmake -S tests/consumer -B consumer-package -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mftl"
          cmake --build consumer-package
          ctest --test-dir consumer-package --output-on-failure
      - name: find_package(MFTL) from a C++-only project
        run: |
          cmake -S tests/consumer -B consumer-package-cxx -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mftl" -DMFTL_CONSUMER_CXX_ONLY=ON
          cmake --build consumer-package-cxx
          ctest --test-dir consumer-package-cxx --output-on-failure
      - name: Build and install the library (Debug, unsanitized)
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=OFF \
                -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build-debug
          cmake --install build-debug --prefix "$RUNNER_TEMP/mftl-debug"
      - name: find_package(MFTL), Debug
        run: |
          cmake -S tests/consumer -B consumer-package-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mftl-debug"
          cmake --build consumer-package-debug
          ctest --test-dir consumer-package-debug --output-on-failure
      - name: A sanitized Debug build refuses to install
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON \
                -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build build-asan
          if cmake --install build-asan --prefix "$RUNNER_TEMP/mftl-asan"; then
            echo "::error::a sanitized Debug build was installed"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/mftl-asan"   # nothing half-installed
      - name: add_subdirectory(MFTL)
        run: |
          cmake -S tests/consumer -B consumer-subdir -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DMFTL_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build consumer-subdir
          ctest --test-dir consumer-subdir --output-on-failure
      - name: add_subdirectory(MFTL) from a C++-only project
        run: |
          cmake -S tests/consumer -B consumer-subdir-cxx -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DMFTL_SOURCE_DIR="$GITHUB_WORKSPACE" -DMFTL_CONSUMER_CXX_ONLY=ON
          cmake --build consumer-subdir-cxx
          ctest --test-dir consumer-subdir-cxx --output-on-failure
