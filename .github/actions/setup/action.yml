name: Set up the toolchain
description: Compiler, MPI implementation and Ninja on an Ubuntu runner.

inputs:
  compiler:
    description: gcc or clang
    default: gcc
  mpi:
    description: >-
      mpich or openmpi. MPICH only on ubuntu-22.04: the package Ubuntu 24.04
      ships (4.2.0-5build3) starts every process of `mpiexec -n N` as a
      singleton of size 1, so each rank runs the whole test alone.
    default: openmpi

runs:
  using: composite
  steps:
    # The packages, kept per runner image: a cache hit installs them without
    # touching Ubuntu's mirror, which has been slow (40 MB in five minutes) and
    # unreachable (a DNS failure that failed every job) on days the cache saves.
    - name: Restore the package cache
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: ~/.cache/mftl-apt
        key: apt-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ inputs.mpi }}
    - name: Install and select
      shell: bash
      env:
        COMPILER: ${{ inputs.compiler }}
        MPI: ${{ inputs.mpi }}
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = macOS ]; then
          # Homebrew's open-mpi is Open MPI 5, whose launcher (PRRTE) takes the
          # oversubscription switch under a different name than Open MPI 4.
          [ "$MPI" = openmpi ] || { echo "macOS: only openmpi is set up" >&2; exit 1; }
          brew install --quiet open-mpi ninja
          echo "PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe" >> "$GITHUB_ENV"
        else
          case "$MPI" in
            mpich)   pkgs="mpich libmpich-dev" ;;
            openmpi) pkgs="openmpi-bin libopenmpi-dev" ;;
            *) echo "unknown MPI '$MPI'" >&2; exit 1 ;;
          esac
          cache="$HOME/.cache/mftl-apt"
          if compgen -G "$cache/*.deb" > /dev/null &&
             sudo apt-get install -y -q --no-install-recommends "$cache"/*.deb; then
            echo "Installed from the package cache"
          else
            sudo apt-get update -q
            mkdir -p "$cache/partial"
            sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::Archives="$cache" ninja-build $pkgs
          fi
        fi

        case "$COMPILER" in
          gcc)   cc=gcc   cxx=g++ ;;
          clang) cc=clang cxx=clang++ ;;
          *) echo "unknown compiler '$COMPILER'" >&2; exit 1 ;;
        esac
        {
          echo "CC=$cc"
          echo "CXX=$cxx"
          # The MPI wrappers (used by tools/check_headers.sh) follow the same compiler.
          echo "MPICH_CC=$cc"
          echo "MPICH_CXX=$cxx"
          echo "OMPI_CC=$cc"
          echo "OMPI_CXX=$cxx"
        } >> "$GITHUB_ENV"

        if [ "$MPI" = openmpi ] && [ "$RUNNER_OS" != macOS ]; then
          # A hosted runner has 4 cores; the suite starts 8-rank jobs, which
          # Open MPI 4 refuses without oversubscription (MPICH allows it).
          echo "OMPI_MCA_rmaps_base_oversubscribe=1" >> "$GITHUB_ENV"
        fi

        "$cc" --version | head -n 1
        mpiexec --version | head -n 2
        cmake --version | head -n 1
