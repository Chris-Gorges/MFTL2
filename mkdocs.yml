# ══════════════════════════════════════════════════════════════════════════════
#  MFTL -- MkDocs / Material configuration
#
#  This site is the MANUAL. The Doxygen manual is the machine-generated
#  REFERENCE, and it is mounted inside this site at /doxygen/ by
#  docs/mkdocs/hooks.py, so there is one deployable artefact and one URL.
#
#  Nothing here duplicates prose. Every guide, module-theory and analysis page
#  is generated at build time from the repository's own Markdown by
#  docs/mkdocs/gen_pages.py, and the API reference is generated from Doxygen XML
#  by mkdoxy, using a Doxyfile derived from docs/doxygen/Doxyfile.in. Both
#  manuals therefore read the same sources with the same settings, which is the
#  rule the Doxyfile template already follows for its two build routes.
# ══════════════════════════════════════════════════════════════════════════════

site_name: MFTL
site_description: >-
  MultiFlow Triangulation Library -- an HPC C11 library for distributed-memory
  manipulation of triangulated surface meshes, for front tracking and
  immersed-boundary CFD.
site_author: Christian Gorges
copyright: Copyright &copy; MFTL 6 &mdash; MultiFlow Triangulation Library

docs_dir: docs/manual
site_dir: build/site
use_directory_urls: true

# ──────────────────────────────────────────────────────────────────────────────
#  Theme
# ──────────────────────────────────────────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/mkdocs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/git-alt
    annotation: material/arrow-right-circle
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/mftl.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  status:
    new: Recently added
    deprecated: Not implemented yet

# ──────────────────────────────────────────────────────────────────────────────
#  Markdown
#
#  Deliberately NOT enabled: smartsymbols, tilde, caret, mark and critic. Each
#  of them claims a character this library's prose uses literally -- `~128 KB`,
#  `a^2`, `ops == 0`, `4/6/19/17` -- and the failure is silent reformatting
#  rather than an error.
# ──────────────────────────────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ──────────────────────────────────────────────────────────────────────────────
#  Plugins
#
#  ORDER MATTERS. mkdoxy runs Doxygen and writes the API pages in its on_files
#  event; gen-files resolves @ref / #Symbol / Function() against the XML mkdoxy
#  just produced. Swap the two and every API cross-reference in the prose
#  degrades to a plain code span on the first build of a clean tree.
# ──────────────────────────────────────────────────────────────────────────────
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  - mkdoxy:
      save-api: build/mkdocs/.doxy
      full-doc: true
      projects:
        mftl:
          src-dirs: include src docs/doxygen
          full-doc: true
          api-path: api
          doxy-cfg-file: build/mkdocs/Doxyfile.api
  - gen-files:
      scripts:
        - docs/mkdocs/gen_pages.py
  - glightbox:
      touchNavigation: true
      effect: zoom
      zoomable: true
  - minify:
      minify_html: true

hooks:
  - docs/mkdocs/hooks.py

# ──────────────────────────────────────────────────────────────────────────────
#  Live reload
#
#  `mkdocs serve` watches docs_dir by default, and docs_dir holds almost none of
#  this site's content. These are the trees gen_pages.py and mkdoxy actually
#  read, so editing a module README or a doc comment reloads the browser.
# ──────────────────────────────────────────────────────────────────────────────
watch:
  - include
  - src
  - docs/pages
  - docs/mkdocs
  - docs/doxygen
  - docs/performance-analysis.md
  - docs/remeshing-quality-analysis.md
  - docs/parallel-remeshing-analysis.md
  - docs/scaling-analysis.md

# ──────────────────────────────────────────────────────────────────────────────
#  Validation
#
#  mkdoxy generates ~170 API pages and only the index pages of that set belong
#  in the navigation, so `omitted_files` is silenced. Anchors are reported but
#  not fatal: Doxygen gives an anonymous enum a machine-generated id that no
#  heading can carry.
# ──────────────────────────────────────────────────────────────────────────────
validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    anchors: info
    absolute_links: ignore
    unrecognized_links: info

# ──────────────────────────────────────────────────────────────────────────────
#  Navigation
# ──────────────────────────────────────────────────────────────────────────────
nav:
  - Home: index.md
  - Overview: overview.md
  - Guide:
      - guide/index.md
      - Building & testing: guide/building.md
      - Architecture: guide/architecture.md
      - The timestep: guide/timestep.md
      - Invariants: guide/invariants.md
  - Modules:
      - modules/index.md
      - arrayfunctions: modules/arrayfunctions.md
      - object: modules/object.md
      - topology: modules/topology.md
      - geometry: modules/geometry.md
      - mesh_creation: modules/mesh_creation.md
      - ensemble: modules/ensemble.md
      - communication: modules/communication.md
      - remeshing: modules/remeshing.md
      - bvh: modules/bvh.md
      - io: modules/io.md
  - Analysis:
      - analysis/index.md
      - Performance: analysis/performance.md
      - Remeshing quality: analysis/remeshing-quality.md
      - Parallel remeshing: analysis/parallel-remeshing.md
      - Scaling: analysis/scaling.md
  - API:
      - api/index.md
      - Topics: api/modules.md
      - Data structures: api/annotated.md
      - Struct fields: api/class_members.md
      - Source files: api/files.md
      - Functions: api/functions.md
      - Macros: api/macros.md
      - Variables: api/variables.md
      - Doxygen manual: api/doxygen-manual.md
